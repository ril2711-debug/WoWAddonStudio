[project]
name = "wowaddonstudio"
version = "0.6.0-dev"
description = "Static analysis platform for World of Warcraft addons"
requires-python = ">=3.12"

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]